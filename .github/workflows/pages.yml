name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check
        run: npm run check

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css script.js logo.png _site/
          cp data/site-lineage.json _site/data/
          if [ -d data/signals ]; then
            mkdir -p _site/data/signals
            cp data/signals/*.json _site/data/signals/ 2>/dev/null || true
          fi
          for dir in assets images media; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

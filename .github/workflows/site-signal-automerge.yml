name: Site signal automerge

on:
  repository_dispatch:
    types: [site_signal]
  workflow_dispatch:
    inputs:
      handle:
        description: Contributor handle
        required: true
        default: "@visitor"
      section:
        description: Site section
        required: true
        default: "Whole site"
      text:
        description: Customization request
        required: true
      sourceVersion:
        description: Source version id
        required: true
        default: "v1"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare-signal:
    runs-on: ubuntu-latest
    outputs:
      signal_id: ${{ steps.prepare.outputs.signal_id }}
      version_id: ${{ steps.prepare.outputs.version_id }}
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      pr_title: ${{ steps.prepare.outputs.pr_title }}
      status_url: ${{ steps.prepare.outputs.status_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare signal prompt
        id: prepare
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          WORKFLOW_HANDLE: ${{ inputs.handle }}
          WORKFLOW_SECTION: ${{ inputs.section }}
          WORKFLOW_TEXT: ${{ inputs.text }}
          WORKFLOW_SOURCE_VERSION: ${{ inputs.sourceVersion }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            export SIGNAL_PAYLOAD="$DISPATCH_PAYLOAD"
          else
            export SIGNAL_PAYLOAD="$(jq -nc \
              --arg handle "$WORKFLOW_HANDLE" \
              --arg section "$WORKFLOW_SECTION" \
              --arg text "$WORKFLOW_TEXT" \
              --arg sourceVersion "$WORKFLOW_SOURCE_VERSION" \
              '{handle:$handle, section:$section, text:$text, sourceVersion:$sourceVersion}')"
          fi

          node scripts/prepare-signal.mjs
          cat .signal-github-outputs >> "$GITHUB_OUTPUT"

      - name: Upload prepared signal
        uses: actions/upload-artifact@v4
        with:
          name: prepared-signal
          path: |
            .signal-payload.json
            .signal-branch-name
            .signal-pr-title
            .signal-pr-body.md
            .codex-signal-prompt.md
          include-hidden-files: true
          retention-days: 1

  build-version:
    runs-on: ubuntu-latest
    needs: prepare-signal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download prepared signal
        uses: actions/download-artifact@v4
        with:
          name: prepared-signal
          path: .

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY repository secret. Add it before automatic chaos can run."
            exit 1
          fi

          if [[ "$OPENAI_API_KEY" == OPENAI_API_KEY=* ]]; then
            echo "::error::OPENAI_API_KEY should be the raw key only, not an OPENAI_API_KEY=... assignment."
            exit 1
          fi

          if [[ "$OPENAI_API_KEY" =~ [[:space:]] ]]; then
            echo "::error::OPENAI_API_KEY contains whitespace. Re-set the secret by pasting only the raw key."
            exit 1
          fi

          if [[ ! "$OPENAI_API_KEY" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::OPENAI_API_KEY contains unsupported characters for codex-action. Re-set the secret with only the raw key characters."
            exit 1
          fi

      - name: Freeze validator
        run: |
          cp scripts/validate-site.mjs /tmp/validate-site.mjs
          cp scripts/signal-utils.mjs /tmp/signal-utils.mjs

      - name: Generate chaotic site version with Codex
        id: run_codex
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-signal-prompt.md
          output-file: .codex-final-message.md
          sandbox: workspace-write
          effort: high
          allow-bots: true

      - name: Mark signal merged
        run: |
          node scripts/mark-signal-status.mjs merged \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status-url "${{ needs.prepare-signal.outputs.status_url }}"

      - name: Guard generated file surface
        run: node scripts/guard-codex-output.mjs

      - name: Build and check
        run: |
          npm run check
          node /tmp/validate-site.mjs

      - name: Commit version branch and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$(cat .signal-branch-name)"
          TITLE="$(cat .signal-pr-title)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "site-signal-bot"
          git config user.email "site-signal-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "$TITLE"
          git push --force-with-lease origin "$BRANCH"

          PR_URL="$(gh pr view "$BRANCH" --json url -q '.url' 2>/dev/null || true)"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file .signal-pr-body.md)"
          fi

          node scripts/mark-signal-status.mjs merged \
            --run-url "$RUN_URL" \
            --pr-url "$PR_URL" \
            --status-url "${{ needs.prepare-signal.outputs.status_url }}"

          if ! git diff --quiet -- data; then
            git add data
            git commit -m "Record signal PR URL"
            git push --force-with-lease origin "$BRANCH"
          fi

          git fetch origin main
          git checkout -B publish-main origin/main
          git merge --squash "$BRANCH"
          git commit -m "$TITLE"
          git push origin HEAD:main

          gh pr close "$PR_URL" \
            --comment "Published directly to main after validation because repository auto-merge is not enabled." \
            --delete-branch || true

      - name: Publish Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  mark-failed:
    runs-on: ubuntu-latest
    needs: [prepare-signal, build-version]
    if: ${{ always() && needs.prepare-signal.result == 'success' && needs.build-version.result == 'failure' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download prepared signal
        uses: actions/download-artifact@v4
        with:
          name: prepared-signal
          path: .

      - name: Mark signal failed
        run: |
          node scripts/mark-signal-status.mjs failed \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status-url "${{ needs.prepare-signal.outputs.status_url }}" \
            --message "Automatic Codex generation failed before publishing."

      - name: Validate status record
        run: node scripts/validate-site.mjs

      - name: Commit failed signal status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "site-signal-bot"
          git config user.email "site-signal-bot@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No failed status changes to commit."
            exit 0
          fi

          git commit -m "Record failed site signal ${{ needs.prepare-signal.outputs.signal_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main || true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Living notebook dream</title>
  <desc id="desc">A bright open notebook with tilted notes, loops, moons, and colored signal paths.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.5" stop-color="#f8fffb"/>
      <stop offset="1" stop-color="#ffe8f5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10163b"/>
      <stop offset="0.42" stop-color="#0f726f"/>
      <stop offset="1" stop-color="#ffd447"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#150923" flood-opacity="0.28"/>
    </filter>
  </defs>
